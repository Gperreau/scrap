name: ORIAS Scraper — 9 jobs parallèles

on:
  workflow_dispatch:
    inputs:
      delay:
        description: "Délai DDG en secondes (défaut 1.5)"
        default: "1.5"

jobs:
  scraper:
    runs-on: ubuntu-latest
    timeout-minutes: 360   # 6h max par job

    strategy:
      fail-fast: false      # un job qui échoue n'arrête pas les autres
      matrix:
        chunk: [1, 2, 3, 4, 5, 6, 7, 8, 9]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Dépendances
        run: |
          pip install aiohttp aiofiles requests beautifulsoup4 lxml \
                      openpyxl duckduckgo-search tqdm pandas

      - name: Scraping bloc ${{ matrix.chunk }}/9
        env:
          SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
        run: |
          python orias_scraper.py run \
            --input        "orias_coa_chunk${{ matrix.chunk }}.csv" \
            --output       "results_chunk${{ matrix.chunk }}_20260608_162219.xlsx" \
            --cache        "cache_chunk${{ matrix.chunk }}.json" \
            --delay        ${{ github.event.inputs.delay }} \
            --email-to     "${{ secrets.EMAIL_TO }}" \
            --email-from   "${{ secrets.EMAIL_FROM }}"

      - name: Upload artefact
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: results-chunk-${{ matrix.chunk }}-20260608_162219
          path: |
            results_chunk${{ matrix.chunk }}_20260608_162219.xlsx
            cache_chunk${{ matrix.chunk }}.json
          retention-days: 30

  merge:
    needs: scraper       # attend que TOUS les jobs soient finis
    runs-on: ubuntu-latest
    if: always()         # fusionne même si certains jobs ont échoué

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Dépendances
        run: pip install openpyxl pandas

      - name: Télécharger tous les artefacts
        uses: actions/download-artifact@v4
        with:
          path: artefacts/

      - name: Fusion des résultats
        run: |
          python orias_scraper.py merge \
            --pattern "artefacts/**/results_chunk*_20260608_162219.xlsx" \
            --output  "orias_resultats_final_20260608_162219.xlsx"

      - name: Upload résultat final
        uses: actions/upload-artifact@v4
        with:
          name: orias-final-20260608_162219
          path: orias_resultats_final_20260608_162219.xlsx
          retention-days: 90

      - name: Envoi email (si configuré)
        if: ${{ secrets.EMAIL_TO != '' }}
        env:
          SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
        run: |
          python orias_scraper.py notify \
            --result  "orias_resultats_final_20260608_162219.xlsx" \
            --email-to    "${{ secrets.EMAIL_TO }}" \
            --email-from  "${{ secrets.EMAIL_FROM }}"
